---
plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.1
  Exclude:
    - bin/*

Gemspec/RequireMFA:
  Enabled: false

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Max: 12

Naming/FileName:
  Exclude:
    - lib/redis-rack.rb

# The specs are end-to-end session scenarios: several requests and
# expectations per example are intended.
RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false
